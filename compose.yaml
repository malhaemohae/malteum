name: malteum

services:
  db:
    image: pgvector/pgvector:pg16
    # 정전·재부팅에도 스스로 돌아온다. 9/7~9/11 접근 불가는 결격이다 (기획 16장 리스크 5)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./back
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      APP_PACK_DIR: /app/contracts/fixtures
      # 근거 원문 PDF (기능 ⑭). 경로를 못박아 둔다 — 기본값은 코드 위치에서 거슬러
      # 올라가 정해지는데, 이미지 안에서는 그 위가 레포 루트가 아니다
      APP_DOCS_DIR: /assets/03_규정문서
      # 구조 추출 덤프. 오프라인에서 떠서 커밋한 결과다(scripts/dump_extraction.py).
      # 서버는 자바를 부르지 않으므로 이미지에 JRE 가 없다 — services/extraction.py
      APP_EXTRACTION_DIR: /assets/extraction
      # 엔진 어댑터. 루트 .env 에서 그대로 넘긴다. 비어 있으면 그 층이 빠지고
      # engine 이 [DUMMY] 경고로 알린다 (bootstrap/startup.py). 값은 .env.example 참조
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-}
      APP_EMBEDDING_BACKEND: ${APP_EMBEDDING_BACKEND:-local}
      APP_EMBEDDING_DIM: ${APP_EMBEDDING_DIM:-384}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-openrouter}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-}
      APP_LLM_NO_REASONING: ${APP_LLM_NO_REASONING:-false}
      APP_LLM_CORRECTOR: ${APP_LLM_CORRECTOR:-false}
      APP_LLM_GENERATOR: ${APP_LLM_GENERATOR:-false}
      APP_L3_BUDGET_MS: ${APP_L3_BUDGET_MS:-3000}   # OpenRouter 왕복 1.2~2.4초 실측(2026-09-04)
      # STT. 비면 오디오 층이 빠지고 ws 가 stt_unavailable 을 낸다 (3층 폴백).
      # 공급자와 키는 .env 에서. 화자 분리는 아래 diarization 사이드카가 기본이다
      APP_STT_PROVIDER: ${APP_STT_PROVIDER:-deepgram}
      APP_STT_API_KEY: ${APP_STT_API_KEY:-}
      APP_STT_BASE_URL: ${APP_STT_BASE_URL:-}
      APP_STT_MODEL: ${APP_STT_MODEL:-nova-3}
      APP_STT_LANGUAGE: ${APP_STT_LANGUAGE:-ko}
      APP_DIARIZATION_URL: ${APP_DIARIZATION_URL:-ws://diarization:8300/ws}
      APP_SPEAKER_HOLD_MS: ${APP_SPEAKER_HOLD_MS:-3000}
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:-}
      APP_UPLOAD_DIR: /uploads
      HF_HOME: /hf
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:
      # 규정 원문은 이미지에 넣지 않는다. 빌드 컨텍스트가 ./back 이라 들어갈 수도 없고,
      # 수십 MB 짜리 PDF 가 이미지에 박히면 배포마다 따라다닌다. 읽기 전용으로 붙인다
      - ./assets:/assets:ro
      # 임베딩 모델(약 470MB)을 볼륨에 둔다. 이미지에 넣으면 배포마다 따라다니고,
      # 안 두면 첫 질의에서 받아온다 — 심사 중에 그러면 안 된다
      - hfcache:/hf
      # 심사위원이 올린 오디오(POST /sessions/{id}/audio). assets 는 읽기 전용이라 자리가 갈린다
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      diarization:
        condition: service_healthy
    healthcheck:
      # 200 만 보면 db 가 죽어도 통과한다. /health 는 그때 status=degraded 를 내므로
      # 그 값까지 본다 (routers/health.py)
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/api/health'))['status']=='ok' else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5

  # Streaming Sortformer 화자 분리 사이드카 (back/sidecar/diarization). CPU 로 돈다 —
  # 청크 0.96초에 처리 0.11초, RSS 약 1.8GB. 서버와 가상환경이 달라 이미지도 따로다.
  # STT 가 화자 번호를 안 주는 공급자(OpenAI)일 때 화자 단계가 이것으로 접착한다
  diarization:
    build: ./back/sidecar/diarization
    restart: unless-stopped
    environment:
      HF_HOME: /hf              # 모델 가중치(nvidia/diar_streaming_sortformer_4spk-v2)는 볼륨에
      OMP_NUM_THREADS: "4"
    volumes:
      - hfcache:/hf
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8300/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 30             # 첫 기동은 가중치를 내려받고 올리느라 몇 분 걸린다
      start_period: 120s

  # 심사위원이 보는 화면. nginx 가 `/` 를 3000 으로 넘긴다(deploy/nginx/malteum.conf).
  # 없으면 API 는 멀쩡한데 루트가 502 다
  front:
    build:
      context: ./front
      args:
        # 브라우저가 아니라 이 컨테이너가 부르는 주소라 compose 망 안쪽 이름을 쓴다
        MALTEUM_BACKEND_URL: http://server:8000
        # 브라우저가 읽는 값이라 빌드 때 번들에 박힌다. **비워 두는 것이 기본이다** —
        # 비면 프런트가 자기 주소에서 `wss://<호스트>/ws` 를 만들어 nginx 를 그대로 타고,
        # 도메인이 바뀌어도 다시 안 구워도 된다. 백엔드가 다른 호스트일 때만 절대 URL
        NEXT_PUBLIC_MALTEUM_WS_URL: ${NEXT_PUBLIC_MALTEUM_WS_URL:-}
        NEXT_PUBLIC_MALTEUM_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${FRONT_PORT:-3000}:3000"

volumes:
  pgdata:
  hfcache:
  uploads:
