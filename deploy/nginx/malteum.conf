# 홈서버 nginx. /etc/nginx/conf.d/malteum.conf 로 둔다 (다른 사이트와 같은 틀).
# 인증서는 dns-cloudflare 로 받은 gjguswns.com 와일드카드를 그대로 쓴다.
server {
    listen 80;
    server_name malteum.gjguswns.com mateum.gjguswns.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name malteum.gjguswns.com mateum.gjguswns.com;

    ssl_certificate /etc/letsencrypt/live/gjguswns.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gjguswns.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # POST /sessions/{id}/audio (multipart). 상담 한 건 오디오가 수십 MB 다
    client_max_body_size 200M;

    # REST. 계약 api.openapi.yaml 의 servers.url 이 /api (단일 호스트 동일 오리진)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # WebSocket. 오디오 프레임 100ms 단위 업링크 + 하트비트. 상담 한 건이 한 연결이라 길게 둔다
    location = /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 프런트(front/, Next.js — M4). 아직 구현 전이라 그때까지는 502 가 정상이다.
    # 프런트가 compose 에 들어오면 포트만 맞춘다
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade    $http_upgrade;   # Next.js dev HMR·미래 대비
        proxy_set_header Connection "upgrade";
    }
}
