name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      # rulepack 의 구조 추출(OpenDataLoader)이 java 를 호출한다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: scripts/gen_models.sh --check
      - run: uv run pytest -q
      # 파이프라인 실행. 테스트만으로는 안 잡히는 것이 있다.
      #   build  : 실제 출력 경로에 쓰는 경로 해석(paths.find_repo_root)
      #   verify : build 를 두 번 돌려 결정성 확인 + 고정 의존성·java·계약 검증
      - run: uv run python -m rulepack.cli build
      - run: uv run python -m rulepack.cli verify --strict
