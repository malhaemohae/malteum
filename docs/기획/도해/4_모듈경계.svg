      <text x="499" y="316" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">api.openapi</text>

      <line x1="750" y1="300" x2="750" y2="358" stroke="#0F6055" stroke-width="1.6" marker-end="url(#a4)"></line>
