      <line x1="528" y1="420" x2="472" y2="420" stroke="#0F6055" stroke-width="1.6" marker-end="url(#a4)"></line>
      <text x="500" y="504" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">rulepack.schema · 파일·DB 를 통해서만</text>

