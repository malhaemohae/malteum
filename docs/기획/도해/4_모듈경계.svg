      <rect x="50" y="56" width="210" height="50" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".3"></rect>
      <text x="155" y="86" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B">ws_protocol.schema.json</text>
      <rect x="280" y="56" width="210" height="50" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".3"></rect>
      <text x="385" y="86" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B">rulepack.schema.json</text>
      <rect x="510" y="56" width="210" height="50" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".3"></rect>
      <text x="615" y="86" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B">events.schema.json</text>
      <rect x="740" y="56" width="210" height="50" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".3"></rect>
      <text x="845" y="86" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B">api.openapi.yaml</text>

      <!-- 모듈 4개 -->
      <rect x="30" y="180" width="440" height="120" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".4"></rect>
      <text x="52" y="210" font-size="13" font-weight="600" fill="#15242B">M4 front</text>
      <text x="52" y="232" font-size="10.5" fill="#15242B" opacity=".68">6화면 + 근거 오버레이 · WebSocket 클라이언트</text>
      <text x="52" y="250" font-size="10.5" fill="#15242B" opacity=".68">AudioWorklet · 프리셋</text>
      <text x="52" y="278" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".55">Next.js · 상태관리 라이브러리 없음</text>

      <rect x="530" y="180" width="440" height="120" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".4"></rect>
      <text x="552" y="210" font-size="13" font-weight="600" fill="#15242B">M1 back/server</text>
      <text x="552" y="232" font-size="10.5" fill="#15242B" opacity=".68">세션 게이트웨이 · 오디오 프레임 · STT 어댑터</text>
      <text x="552" y="250" font-size="10.5" fill="#15242B" opacity=".68">3+1 실행 모드 · 재접속 · 하트비트</text>
      <text x="552" y="278" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".55">FastAPI · 인프라·배포 겸임</text>

      <rect x="530" y="360" width="440" height="120" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".4"></rect>
