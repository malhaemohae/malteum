<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" font-family="'IBM Plex Sans KR', 'Malgun Gothic', sans-serif" viewBox="0 0 1000 520" role="img" aria-label="back/contracts 디렉토리의 스키마 네 개를 8월 28일에 동결하고, M4 front와 M1 back/server는 WebSocket 프로토콜로, M1과 M2 back/engine은 함수 시그니처로, M2와 M3 back/rulepack은 규정 팩 스키마로만 만나는 모듈 경계도">
      <defs>
        <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#15242B" fill-opacity=".55"></path>
        </marker>
      </defs>

      <!-- contracts -->
      <rect x="30" y="34" width="940" height="92" rx="3" fill="#FFFFFF" stroke="#0F6055" stroke-width="1.8"></rect>
