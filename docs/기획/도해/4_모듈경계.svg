      <text x="552" y="412" font-size="10.5" fill="#15242B" opacity=".68">L1 규칙 · L2 임베딩 검색 · L3 심판</text>
      <text x="552" y="430" font-size="10.5" fill="#15242B" opacity=".68">3방향 상태 머신 · 판정 캐시</text>
      <text x="552" y="458" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".55">팩을 읽기만 한다</text>

      <rect x="30" y="360" width="440" height="120" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".4"></rect>
      <text x="52" y="390" font-size="13" font-weight="600" fill="#15242B">M3 back/rulepack</text>
      <text x="52" y="412" font-size="10.5" fill="#15242B" opacity=".68">OpenDataLoader 청킹 · LLM 추출 · 스팬 대조</text>
      <text x="52" y="430" font-size="10.5" fill="#15242B" opacity=".68">pypdfium2 좌표 · 팩 발행 · 금지·위험 팩</text>
      <text x="52" y="458" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".55">팩을 만들기만 한다</text>

