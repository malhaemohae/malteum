<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" font-family="'IBM Plex Sans KR', 'Malgun Gothic', sans-serif" viewBox="0 0 1040 530" role="img" aria-label="오디오 프레임이 STT와 발화 조립을 거쳐 L1 규칙, L2 의미검색, L3 LLM 심판 3단을 통과하고, 누락 금지 이해 세 방향 상태 머신을 갱신해 화면에 두 번 반영되는 실시간 판정 경로">
      <defs>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#15242B" fill-opacity=".55"></path>
        </marker>
      </defs>

      <rect x="30" y="62" width="150" height="54" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="105" y="85" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">오디오 프레임</text>
      <text x="105" y="101" text-anchor="middle" font-size="10" fill="#15242B" opacity=".6">100ms · 3,200바이트</text>

      <rect x="215" y="62" width="150" height="54" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="290" y="85" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">STT 어댑터</text>
      <text x="290" y="101" text-anchor="middle" font-size="10" fill="#15242B" opacity=".6">partial / final</text>

      <rect x="400" y="62" width="180" height="54" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="490" y="85" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">발화 조립 · 정규화</text>
      <text x="490" y="101" text-anchor="middle" font-size="10" fill="#15242B" opacity=".6">문장 경계 · 화자 · PII 마스킹</text>

      <!-- 3단 판정 -->
      <rect x="615" y="30" width="395" height="180" rx="3" fill="none" stroke="#15242B" stroke-opacity=".22" stroke-dasharray="4 3"></rect>
      <text x="627" y="24" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing=".08em" fill="#15242B" opacity=".62">3단 판정 · 값비싼 판정기를 애매한 입력에만</text>

      <rect x="633" y="56" width="359" height="38" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="647" y="80" font-size="11.5" font-weight="500" fill="#15242B">L1 결정 규칙</text>
      <text x="800" y="80" font-size="10" fill="#15242B" opacity=".6">정규식 · 키워드 · 수치</text>
      <text x="978" y="80" text-anchor="end" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">약 1ms</text>

      <rect x="633" y="102" width="359" height="38" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="647" y="126" font-size="11.5" font-weight="500" fill="#15242B">L2 의미 검색</text>
      <text x="800" y="126" font-size="10" fill="#15242B" opacity=".6">로컬 임베딩 · 상위 K</text>
      <text x="978" y="126" text-anchor="end" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">5~20ms</text>

      <rect x="633" y="148" width="359" height="46" rx="2" fill="#FFFFFF" stroke="#0F6055" stroke-width="1.8"></rect>
      <text x="647" y="169" font-size="11.5" font-weight="600" fill="#15242B">L3 LLM 심판</text>
      <text x="647" y="185" font-size="10" fill="#0F6055">최종 판정권 (P2 개정)</text>
      <text x="978" y="177" text-anchor="end" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">300~1500ms</text>

      <!-- 3방향 상태 머신 -->
      <rect x="30" y="262" width="980" height="150" rx="3" fill="none" stroke="#15242B" stroke-opacity=".22" stroke-dasharray="4 3"></rect>
      <text x="42" y="256" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing=".08em" fill="#15242B" opacity=".62">항목 상태 머신 · 3방향 · 되돌림 금지</text>

      <rect x="48" y="288" width="305" height="102" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="66" y="312" font-size="12" font-weight="500" fill="#15242B">누락 (omission)</text>
      <text x="66" y="332" font-size="10.5" fill="#15242B" opacity=".65">말해야 할 것을 하지 않음</text>
      <text x="66" y="354" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".75">unmet → partial → met</text>
      <text x="66" y="374" font-size="10" fill="#15242B" opacity=".55">waived 는 사람만 · 금소법 §19</text>

      <rect x="368" y="288" width="305" height="102" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="386" y="312" font-size="12" font-weight="500" fill="#15242B">금지 발언 (commission)</text>
      <text x="386" y="332" font-size="10.5" fill="#15242B" opacity=".65">하면 안 되는 말을 함</text>
      <text x="386" y="354" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".75">clean → suspected → violated</text>
      <text x="386" y="374" font-size="10" fill="#15242B" opacity=".55">숫자 오류 · 위험 신호 포함 · 금소법 §21</text>

      <rect x="688" y="288" width="305" height="102" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="706" y="312" font-size="12" font-weight="500" fill="#15242B">이해 (comprehension)</text>
      <text x="706" y="332" font-size="10.5" fill="#15242B" opacity=".65">말은 했으나 못 알아들음</text>
      <text x="706" y="354" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".75">explained → confirmed</text>
      <text x="706" y="374" font-size="10" fill="#15242B" opacity=".55">증빙 아님 · 재진술 힌트로만 · §19②</text>

      <!-- 화면 -->
      <rect x="30" y="452" width="980" height="52" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="200" y="474" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">화면 갱신</text>
      <text x="200" y="491" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">개입 슬롯 · 체크리스트 · 넛지 띠</text>
      <text x="640" y="474" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".75">ver 1 즉시 (L1·L2)  →  ver 2 보정 (L3)</text>
      <text x="640" y="491" text-anchor="middle" font-size="10" fill="#15242B" opacity=".55">프런트는 큰 ver 만 채택해 순서 뒤바뀜을 흡수</text>

      <!-- 화살표 -->
      <line x1="180" y1="89" x2="213" y2="89" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a2)"></line>
      <line x1="365" y1="89" x2="398" y2="89" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a2)"></line>
      <text x="368" y="80" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">final</text>
      <line x1="580" y1="89" x2="631" y2="89" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a2)"></line>

      <line x1="812" y1="194" x2="812" y2="258" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a2)"></line>
      <text x="822" y="230" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">판정 + 빠진 요소</text>

      <line x1="520" y1="412" x2="520" y2="448" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a2)"></line>

    </svg>
