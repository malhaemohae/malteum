<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" font-family="'IBM Plex Sans KR', 'Malgun Gothic', sans-serif" viewBox="0 0 1040 420" role="img" aria-label="규정 문서가 OpenDataLoader 구조 추출, 조항 청킹, LLM 항목 추출을 거친 뒤 근거 스팬 대조에서 불일치 항목이 폐기되고, pypdfium2 좌표 부여와 사람 승인을 지나 불변 팩으로 발행되는 파이프라인">
      <defs>
        <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#15242B" fill-opacity=".55"></path>
        </marker>
      </defs>

      <!-- 1행 -->
      <rect x="30" y="46" width="215" height="62" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="46" y="70" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">1</text>
      <text x="137" y="72" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">규정 문서</text>
      <text x="137" y="90" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">법령 · 약관 · 상품설명서</text>

      <rect x="275" y="46" width="215" height="62" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="291" y="70" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">2</text>
      <text x="382" y="72" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">OpenDataLoader</text>
      <text x="382" y="90" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">표 셀 · 조항 · 요소 bbox</text>

      <rect x="520" y="46" width="215" height="62" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="536" y="70" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">3</text>
      <text x="627" y="72" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">조·항 청킹</text>
      <text x="627" y="90" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">list item + 정규식</text>

      <rect x="765" y="46" width="215" height="62" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="781" y="70" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">4</text>
      <text x="872" y="72" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">LLM 항목 추출</text>
      <text x="872" y="90" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">여기서 환각이 들어온다</text>

      <!-- 2행 -->
      <rect x="30" y="218" width="215" height="62" rx="2" fill="#FFFFFF" stroke="#0F6055" stroke-width="1.8"></rect>
      <text x="46" y="242" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">5</text>
      <text x="137" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#15242B">근거 스팬 대조</text>
      <text x="137" y="262" text-anchor="middle" font-size="10" fill="#0F6055">환각 차단 관문 (P4)</text>

      <rect x="275" y="218" width="215" height="62" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="291" y="242" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">6</text>
      <text x="382" y="244" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">pypdfium2 좌표</text>
      <text x="382" y="262" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">문자 단위 · 문장 하이라이트</text>

      <rect x="520" y="218" width="215" height="62" rx="2" fill="#FFFFFF" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="536" y="242" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">7</text>
      <text x="627" y="244" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">사람 승인</text>
      <text x="627" y="262" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">원문 대조 · 승인·수정·기각</text>

      <rect x="765" y="218" width="215" height="62" rx="2" fill="#EEF3F2" stroke="#15242B" stroke-opacity=".38"></rect>
      <text x="781" y="242" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#0F6055">8</text>
      <text x="872" y="244" text-anchor="middle" font-size="12" font-weight="500" fill="#15242B">팩 발행</text>
      <text x="872" y="262" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">불변 · 버전 고정</text>

      <!-- 폐기 -->
      <rect x="30" y="332" width="215" height="50" rx="2" fill="none" stroke="#AF3A20" stroke-width="1.4" stroke-dasharray="5 3"></rect>
      <text x="137" y="352" text-anchor="middle" font-size="11.5" font-weight="500" fill="#AF3A20">항목 폐기</text>
      <text x="137" y="369" text-anchor="middle" font-size="10" fill="#15242B" opacity=".62">근거 없는 항목 0건 보장</text>

      <!-- 화살표 -->
      <line x1="245" y1="77" x2="273" y2="77" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></line>
      <line x1="490" y1="77" x2="518" y2="77" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></line>
      <line x1="735" y1="77" x2="763" y2="77" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></line>

      <polyline points="872,108 872,163 137,163 137,216" fill="none" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></polyline>
      <text x="470" y="156" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">추출된 항목 후보 + 인용 문자열</text>

      <line x1="245" y1="249" x2="273" y2="249" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></line>
      <text x="248" y="240" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#15242B" opacity=".62">일치</text>
      <line x1="490" y1="249" x2="518" y2="249" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></line>
      <line x1="735" y1="249" x2="763" y2="249" stroke="#15242B" stroke-opacity=".45" marker-end="url(#a3)"></line>

      <line x1="137" y1="280" x2="137" y2="330" stroke="#AF3A20" stroke-opacity=".7" marker-end="url(#a3)"></line>
      <text x="148" y="308" font-size="10" font-family="'IBM Plex Mono', Consolas, monospace" fill="#AF3A20">불일치</text>
    </svg>
