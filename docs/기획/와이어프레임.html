<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px clamp(16px,3vw,40px) 120px}
header.top{display:flex;flex-direction:column;gap:12px;padding-bottom:24px;border-bottom:1px solid var(--rule-strong)}

section{margin-top:56px}

.board{margin:0 0 34px}
.board figcaption{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.board .t{font-size:14px;font-weight:600}
.board .d{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.stage{position:relative;overflow:hidden;background:var(--surface-2);border:1px solid var(--rule-strong)}
.shot{transform-origin:top left;line-height:normal;font-family:var(--f-body)}
footer.end{margin-top:80px;padding-top:20px;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 20px}
</style>

<section><h2>브리프</h2><p class="lede">읽는 법과 태스크 흐름</p><figure class="board"><figcaption><span class="t">W 브리프</span><span class="d">860 x 1180</span></figcaption><div class="stage" data-w="860" data-h="1180"><div class="shot" style="width:860px;height:1180px"><div style="width: 860px; height: 1180px; box-sizing: border-box; background: #ffffff; border: 1px solid #9a9a9a; display: flex; flex-direction: column; overflow: hidden"><div style="padding: 34px 32px; display: flex; flex-direction: column; gap: 26px; overflow: hidden"><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; color: #9a9a9a">WIREFRAME · 2026-08-23</span><div style="font-size: 28px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em">말틈 · 와이어프레임</div><div style="font-size: 13.5px; line-height: 1.7; color: #666666">레이아웃과 흐름만 다룬다. 시각 스타일은 회색조로 묶어 두었다.</div></div><div style="height: 1px; background: #9a9a9a"></div><div style="display: flex; flex-direction: column; gap: 16px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: #1a1a1a">읽는 법</span><div style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; gap: 10px; align-items: flex-start"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #1a1a1a; border: 1px dashed #9a9a9a; padding: 2px 6px; white-space: nowrap">점선</span><span style="font-size: 12px; line-height: 1.55; color: #666666">설계 주석. 화면에 나가는 글자가 아니다.</span></div><div style="display: flex; gap: 10px; align-items: flex-start"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #1a1a1a; border: 1px dashed #9a9a9a; padding: 2px 6px; white-space: nowrap">실선</span><span style="font-size: 12px; line-height: 1.55; color: #666666">실제 UI 요소.</span></div><div style="display: flex; gap: 10px; align-items: flex-start"><span style="font-family: 'IBM Plex Mono', m ="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">종료</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">리포트</div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #1a1a1a">은행원</span><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">앱 진입</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">상품·고객 선택</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">브리핑</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">라이브</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">종료</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">리포트</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">PDF</div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #1a1a1a">컴플라이언스</span><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">규정 팩</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">검수 대기</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">문서 검수</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">승인</div><span style="font-size: 13px; color: #9a9a9a">→</span><div style="border: 1px solid #9a9a9a; padding: 8px 12px; font-size: 12px; white-space: nowrap">팩 발행</div></div></div></div><div style="height: 1px; background: #cfcfcf"></div><div style="display: flex; flex-direction: column; gap: 14px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: #1a1a1a">아트보드 14장</span><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Landing</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">스크롤 없는 단일 화면. 주 행동 1개</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Live</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">앱 메인. 개입 슬롯이 상담 단계에 따라 역할을 바꿈</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Live 변형 6</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">상담 전 · 평상 · 위험 신호 · 재진술 · 역질문 · 종료 직후</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Report</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">항목별 이행 증빙. 행 클릭으로 근거 오버레이</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Pack</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">팩 목록 · 검수 대기 · 항목 표 · 개정 감지 알림</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Documents</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">업로드 · 추출 · 근거 스팬 검증 · 승인 · 발행</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Sessions</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">이력 · trace 재생</span></div><div style="display: flex; gap: 12px; align-items: baseline"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1a1a1a; width: 78px; flex-shrink: 0">Overlay</span><span style="font-size: 12.5px; color: #666666; line-height: 1.55">근거 원문. 어느 화면에서든 열림</span></div></div><div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #cfcfcf"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #9a9a9a">말틈 · 2026 금융 AI Challenge</span></div></div></div></div></div></figure></section><section><h2>화면</h2><p class="lede">랜딩과 앱 화면 5개, 근거 원문 오버레이</p><figure class="board"><figcaption><span class="t">L0 랜딩</span><span class="d">1440 x 900</span></figcaption><div class="stage" data-w="1440" data-h="900"><div class="shot" style="width:1440px;height:900px"><div style="width: 1440px; height: 900px; box-sizing: border-box; background: #ffffff; border: 1px solid #9a9a9a; display: flex; flex-direction: column; overflow: hidden <script>
(function(){
  // 고정폭 아트보드를 컨테이너 폭에 맞춰 축소한다.
  // transform 은 레이아웃 크기를 바꾸지 않으므로 부모 높이를 직접 계산한다.
  function fit(){
    document.querySelectorAll('.stage').forEach(function(st){
      var shot = st.querySelector('.shot');
      var w = +st.dataset.w, h = +st.dataset.h;
      var s = Math.min(1, st.clientWidth / w);
      shot.style.transform = 'scale(' + s + ')';
      st.style.height = Math.round(h * s) + 'px';
    });
  }
  fit();
  window.addEventListener('resize', fit, {passive:true});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
